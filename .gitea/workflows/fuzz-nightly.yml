# Nightly fuzzing for lumi-server (Phase 3 quality harness, WP 0.10):
# every native Go fuzz target in internal/crdt (diff hunks, 3-way merge,
# the update guard in front of yrs) for 10 minutes each, 30 minutes in
# total, against the real libyrs. A crasher fails the job and is printed
# in full, so it can be committed under testdata/fuzz/<Target>/ as a
# permanent regression input. Locally: FUZZTIME=2m scripts/fuzz.sh
name: fuzz-nightly

on:
  schedule:
    - cron: '43 5 * * *'   # 02:43 em Brasília
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'tempo por alvo (ex.: 10m)'
        required: false
        default: '10m'

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.14-bookworm
    timeout-minutes: 60
    env:
      GITEA_URL: ${{ vars.LAN_GIT_URL }}
      RUSTUP_VERSION: "1.29.3"
      RUSTUP_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
      RUST_TOOLCHAIN: "1.100.0"
      CGO_ENABLED: "1"
      FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}
    steps:
      - name: checkout (with third_party/y-crdt)
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          YCRDT_GIT_URL: ${{ vars.YCRDT_GIT_URL }}
        run: |
          set -eu
          [ -n "$GITEA_URL" ] || { echo "::error::set the LAN_GIT_URL organisation variable"; exit 1; }
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git config --global "http.$GITEA_URL/.extraheader" "AUTHORIZATION: basic $auth"
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITEA_URL/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          # y-crdt is public on GitHub; optionally use a local mirror.
          if [ -n "${YCRDT_GIT_URL:-}" ]; then
            git config --global "url.$YCRDT_GIT_URL.insteadOf" "https://github.com/y-crdt/y-crdt.git"
          fi
          git submodule update --init --depth 1 third_party/y-crdt
          git config --global --unset-all "http.$GITEA_URL/.extraheader"
          git log --oneline -1
          git submodule status

      - name: install Rust (pinned)
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y -q --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: libyrs (cargo build -p yffi)
        run: |
          set -eu
          cargo --version
          make libyrs

      - name: fuzz (30 min)
        run: scripts/fuzz.sh

      - name: crashers
        if: failure()
        run: |
          for f in $(git ls-files --others --exclude-standard -- '*/testdata/fuzz/*'); do
            echo "::error file=$f::fuzz crasher"; echo "--- $f"; cat "$f"; echo
          done
